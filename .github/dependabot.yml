# =============================================================================
# Dependabot - Automated dependency updates
# =============================================================================

version: 2

updates:
  # ── pip (FastAPI app) ────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python

  # ── npm (receipt registry Worker) ───────────────────────────────────────
  - package-ecosystem: npm
    directory: /registry
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # ── GitHub Actions ──────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
