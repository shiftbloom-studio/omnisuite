name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-validation:
    name: "Python · Validate (${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --only-binary :all: --upgrade pip
          python -m pip install --only-binary :all: -r requirements-dev.txt

      - name: Bytecode compile core modules
        run: python -m py_compile app.py receipts.py runtime_config.py test_engine.py

      - name: Run tests
        env:
          # Also run the watermark tests that download the AudioSeal weights.
          OMNISUITE_TEST_AUDIOSEAL: "1"
        run: python -m pytest

      - name: Smoke-check app status payload
        run: |
          python -c "import asyncio; import app; payload = asyncio.run(app.status()); assert payload['status'] == 'not_loaded'; assert payload['device'] in {'cpu', 'mps'}; assert payload['dtype'] == 'float32'; assert 'torchcodec' in payload['dependencies']; print(payload)"
