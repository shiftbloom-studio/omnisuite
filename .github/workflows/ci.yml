name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-validation:
    name: "Python · Validate (${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Bytecode compile core modules
        run: python -m py_compile app.py runtime_config.py test_engine.py

      - name: Smoke-check app status payload
        run: |
          python -c "import asyncio; import app; payload = asyncio.run(app.status()); assert payload['status'] == 'not_loaded'; assert payload['device'] in {'cpu', 'mps'}; assert payload['dtype'] == 'float32'; assert 'torchcodec' in payload['dependencies']; print(payload)"
