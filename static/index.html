<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniSuite</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
    }

    header {
      padding: 24px 32px;
      border-bottom: 2px solid #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 4px;
    }

    .logo span:first-child { color: #FF3D00; }
    .logo span:last-child { color: #666; }

    .status {
      font-size: 12px;
      padding: 4px 12px;
      border: 1px solid #333;
      border-radius: 2px;
      color: #888;
    }

    .status.ready { border-color: #22c55e; color: #22c55e; }
    .status.loading { border-color: #f59e0b; color: #f59e0b; }
    .status.error { border-color: #ef4444; color: #ef4444; }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 32px;
    }

    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 32px;
      border-bottom: 2px solid #1a1a1a;
    }

    .tab {
      padding: 12px 24px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
    }

    .tab.active {
      color: #FF3D00;
      border-bottom-color: #FF3D00;
    }

    .tab:hover { color: #e0e0e0; }

    .panel { display: none; }
    .panel.active { display: block; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 6px;
    }

    select, textarea, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      background: #111;
      border: 2px solid #222;
      color: #e0e0e0;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      margin-bottom: 16px;
    }

    select:focus, textarea:focus, input:focus {
      border-color: #FF3D00;
    }

    textarea { resize: vertical; min-height: 120px; }

    .row { display: flex; gap: 12px; align-items: flex-end; }
    .row > * { flex: 1; }

    button.btn {
      padding: 10px 24px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: 2px solid #FF3D00;
      background: #FF3D00;
      color: #fff;
      cursor: pointer;
    }

    button.btn:hover { background: #e63600; }
    button.btn:disabled { opacity: 0.4; cursor: not-allowed; }

    button.btn.secondary {
      background: transparent;
      color: #FF3D00;
    }

    button.btn.secondary:hover { background: #FF3D0015; }

    button.btn.danger {
      border-color: #ef4444;
      background: transparent;
      color: #ef4444;
    }

    .player {
      margin-top: 20px;
      padding: 16px;
      background: #111;
      border: 2px solid #222;
    }

    .player audio { width: 100%; }

    .error {
      padding: 12px;
      background: #1a0000;
      border: 1px solid #ef4444;
      color: #ef4444;
      font-size: 13px;
      margin-top: 12px;
    }

    .field { margin-bottom: 16px; }

    .voice-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .voice-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #111;
      border: 1px solid #1a1a1a;
      font-size: 13px;
    }

    .voice-item .name { font-weight: 600; }
    .voice-item .meta { color: #666; font-size: 11px; }

    .voice-item button {
      background: none;
      border: 1px solid #333;
      color: #888;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
    }

    .voice-item button:hover { border-color: #ef4444; color: #ef4444; }

    .step-indicator {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .step-dot {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #333;
      font-size: 12px;
      font-weight: 700;
      color: #666;
    }

    .step-dot.active { border-color: #FF3D00; color: #FF3D00; background: #FF3D0020; }
    .step-dot.done { border-color: #22c55e; color: #22c55e; }

    .drop-zone {
      border: 2px dashed #333;
      padding: 40px;
      text-align: center;
      color: #666;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 16px;
    }

    .drop-zone:hover { border-color: #FF3D00; color: #888; }
    .drop-zone.has-file { border-color: #22c55e; color: #22c55e; border-style: solid; }

    .generating { opacity: 0.6; pointer-events: none; }

    .hint {
      font-size: 11px;
      color: #555;
      margin-top: -12px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo"><span>OMNI</span><span>SUITE</span></div>
  <div class="status" id="status">Connecting...</div>
</header>

<main>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('synth')">Synthesize</button>
    <button class="tab" onclick="switchTab('clone')">Clone Voice</button>
    <button class="tab" onclick="switchTab('voices')">Voices</button>
  </div>

  <!-- ── Synthesize ──────────────────────────────────────────── -->
  <div class="panel active" id="panel-synth">
    <div class="field">
      <label>Voice</label>
      <select id="synth-voice"></select>
    </div>

    <div class="field">
      <label>Text</label>
      <textarea id="synth-text" placeholder="Enter text to synthesize..."></textarea>
    </div>

    <div class="row">
      <div class="field">
        <label>Speed</label>
        <input type="number" id="synth-speed" value="1.0" min="0.5" max="2.0" step="0.1">
      </div>
      <div>
        <button class="btn" id="synth-btn" onclick="synthesize()">Generate</button>
      </div>
    </div>

    <div id="synth-error"></div>
    <div id="synth-player" class="player" style="display:none">
      <audio id="synth-audio" controls></audio>
    </div>
  </div>

  <!-- ── Clone Voice ─────────────────────────────────────────── -->
  <div class="panel" id="panel-clone">
    <div class="step-indicator">
      <div class="step-dot active" id="step-1">1</div>
      <div class="step-dot" id="step-2">2</div>
      <div class="step-dot" id="step-3">3</div>
    </div>

    <!-- Step 1: Upload -->
    <div id="clone-step-1">
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('clone-file').click()">
        Drop a WAV/MP3 file here or click to browse
      </div>
      <input type="file" id="clone-file" accept=".wav,.mp3,.flac" style="display:none" onchange="handleCloneFile(this)">
      <button class="btn" id="clone-next-1" disabled onclick="cloneNext(2)">Next</button>
    </div>

    <!-- Step 2: Transcript + Test -->
    <div id="clone-step-2" style="display:none">
      <div class="field">
        <label>Transcript</label>
        <textarea id="clone-transcript" placeholder="Type exactly what is said in the audio..."></textarea>
        <p class="hint">Accurate transcript = better voice clone</p>
      </div>

      <div class="field">
        <label>Test Text</label>
        <input type="text" id="clone-test-text" value="Hello, this is a test of my cloned voice.">
      </div>

      <div class="row">
        <button class="btn secondary" onclick="cloneNext(1)">Back</button>
        <button class="btn secondary" onclick="cloneTest()">Test Voice</button>
        <button class="btn" onclick="cloneNext(3)">Next</button>
      </div>

      <div id="clone-test-error"></div>
      <div id="clone-test-player" class="player" style="display:none">
        <audio id="clone-test-audio" controls></audio>
      </div>
    </div>

    <!-- Step 3: Save -->
    <div id="clone-step-3" style="display:none">
      <div class="field">
        <label>Voice Name</label>
        <input type="text" id="clone-name" placeholder="My Voice">
      </div>

      <div class="field">
        <label>Language</label>
        <select id="clone-language">
          <option value="en">English</option>
          <option value="de">German</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
          <option value="it">Italian</option>
          <option value="ja">Japanese</option>
          <option value="hi">Hindi</option>
        </select>
      </div>

      <div class="row">
        <button class="btn secondary" onclick="cloneNext(2)">Back</button>
        <button class="btn" onclick="cloneSave()">Save Voice</button>
      </div>

      <div id="clone-save-error"></div>
    </div>
  </div>

  <!-- ── Voices ──────────────────────────────────────────────── -->
  <div class="panel" id="panel-voices">
    <div class="voice-list" id="voice-list"></div>
  </div>
</main>

<script>
  // ── State ───────────────────────────────────────────────────
  let voices = [];
  let cloneFile = null;
  let cloneStep = 1;

  // ── Tabs ────────────────────────────────────────────────────
  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
    document.getElementById(`panel-${tab}`).classList.add('active');
    if (tab === 'voices') loadVoices();
    if (tab === 'synth') loadVoiceSelect();
  }

  // ── Status polling ──────────────────────────────────────────
  async function pollStatus() {
    try {
      const r = await fetch('/api/status');
      const d = await r.json();
      const el = document.getElementById('status');
      el.textContent = d.status === 'ready' ? 'Ready' : d.status === 'loading' ? 'Loading model...' : d.status;
      el.className = 'status ' + (d.status === 'ready' ? 'ready' : d.status === 'loading' ? 'loading' : d.status === 'error' ? 'error' : '');
    } catch { /* retry */ }
  }
  setInterval(pollStatus, 3000);
  pollStatus();

  // ── Voices ──────────────────────────────────────────────────
  async function loadVoices() {
    try {
      const r = await fetch('/api/voices');
      voices = await r.json();
      renderVoiceList();
      loadVoiceSelect();
    } catch {}
  }

  function loadVoiceSelect() {
    const sel = document.getElementById('synth-voice');
    const current = sel.value;
    sel.innerHTML = '';
    const cloned = voices.filter(v => v.type === 'cloned');
    if (cloned.length === 0) {
      sel.innerHTML = '<option value="" disabled>No voices yet — clone one first</option>';
      return;
    }
    cloned.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.id;
      opt.textContent = `${v.name} [${v.language}]`;
      sel.appendChild(opt);
    });
    if (current && cloned.find(v => v.id === current)) sel.value = current;
  }

  function renderVoiceList() {
    const list = document.getElementById('voice-list');
    const cloned = voices.filter(v => v.type === 'cloned');
    if (cloned.length === 0) {
      list.innerHTML = '<p style="color:#666;font-size:13px;padding:20px">No cloned voices yet. Go to "Clone Voice" to create one.</p>';
      return;
    }
    list.innerHTML = cloned.map(v => `
      <div class="voice-item">
        <div>
          <span class="name">${v.name}</span>
          <span class="meta"> &middot; ${v.language} &middot; ${v.description || 'cloned'}</span>
        </div>
        <button onclick="deleteVoice('${v.id}')">Delete</button>
      </div>
    `).join('');
  }

  async function deleteVoice(id) {
    if (!confirm('Delete this voice?')) return;
    await fetch(`/api/voices/${id}`, { method: 'DELETE' });
    loadVoices();
  }

  // ── Synthesize ──────────────────────────────────────────────
  async function synthesize() {
    const voiceId = document.getElementById('synth-voice').value;
    const text = document.getElementById('synth-text').value.trim();
    const speed = parseFloat(document.getElementById('synth-speed').value) || 1.0;

    if (!voiceId || !text) return;

    const btn = document.getElementById('synth-btn');
    btn.disabled = true;
    btn.textContent = 'Generating...';
    document.getElementById('synth-error').innerHTML = '';
    document.getElementById('synth-player').style.display = 'none';

    try {
      const form = new FormData();
      form.append('text', text);
      form.append('voice_id', voiceId);
      form.append('speed', speed);

      const r = await fetch('/api/generate', { method: 'POST', body: form });
      if (!r.ok) {
        const err = await r.json();
        throw new Error(err.error || 'Generation failed');
      }

      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      document.getElementById('synth-audio').src = url;
      document.getElementById('synth-player').style.display = 'block';
    } catch (e) {
      document.getElementById('synth-error').innerHTML = `<div class="error">${e.message}</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Generate';
    }
  }

  // ── Clone ───────────────────────────────────────────────────
  function handleCloneFile(input) {
    if (input.files.length > 0) {
      cloneFile = input.files[0];
      const dz = document.getElementById('drop-zone');
      dz.textContent = cloneFile.name;
      dz.classList.add('has-file');
      document.getElementById('clone-next-1').disabled = false;
    }
  }

  function cloneNext(step) {
    for (let i = 1; i <= 3; i++) {
      document.getElementById(`clone-step-${i}`).style.display = i === step ? 'block' : 'none';
      const dot = document.getElementById(`step-${i}`);
      dot.className = 'step-dot' + (i === step ? ' active' : i < step ? ' done' : '');
    }
    cloneStep = step;
  }

  async function cloneTest() {
    const text = document.getElementById('clone-test-text').value.trim();
    const refText = document.getElementById('clone-transcript').value.trim();
    if (!cloneFile || !text) return;

    document.getElementById('clone-test-error').innerHTML = '';
    document.getElementById('clone-test-player').style.display = 'none';

    const form = new FormData();
    form.append('ref_audio', cloneFile);
    form.append('ref_text', refText);
    form.append('text', text);

    try {
      const r = await fetch('/api/clone/test', { method: 'POST', body: form });
      if (!r.ok) {
        const err = await r.json();
        throw new Error(err.error || 'Test failed');
      }
      const blob = await r.blob();
      document.getElementById('clone-test-audio').src = URL.createObjectURL(blob);
      document.getElementById('clone-test-player').style.display = 'block';
    } catch (e) {
      document.getElementById('clone-test-error').innerHTML = `<div class="error">${e.message}</div>`;
    }
  }

  async function cloneSave() {
    const name = document.getElementById('clone-name').value.trim();
    const language = document.getElementById('clone-language').value;
    const refText = document.getElementById('clone-transcript').value.trim();
    if (!cloneFile || !name) return;

    const form = new FormData();
    form.append('ref_audio', cloneFile);
    form.append('ref_text', refText);
    form.append('name', name);
    form.append('language', language);

    try {
      const r = await fetch('/api/clone/save', { method: 'POST', body: form });
      if (!r.ok) {
        const err = await r.json();
        throw new Error(err.error || 'Save failed');
      }
      alert(`Voice "${name}" saved!`);
      cloneFile = null;
      cloneNext(1);
      document.getElementById('drop-zone').textContent = 'Drop a WAV/MP3 file here or click to browse';
      document.getElementById('drop-zone').classList.remove('has-file');
      document.getElementById('clone-next-1').disabled = true;
      loadVoices();
      switchTab('voices');
    } catch (e) {
      document.getElementById('clone-save-error').innerHTML = `<div class="error">${e.message}</div>`;
    }
  }

  // ── Drag & drop ─────────────────────────────────────────────
  const dz = document.getElementById('drop-zone');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.style.borderColor = '#FF3D00'; });
  dz.addEventListener('dragleave', () => { dz.style.borderColor = ''; });
  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.style.borderColor = '';
    if (e.dataTransfer.files.length > 0) {
      const input = document.getElementById('clone-file');
      input.files = e.dataTransfer.files;
      handleCloneFile(input);
    }
  });

  // ── Init ────────────────────────────────────────────────────
  loadVoices();
</script>

</body>
</html>
